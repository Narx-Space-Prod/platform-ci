name: SonarQube Cloud

on:
  workflow_call:
    inputs:
      project-key:
        description: Exact key of the provisioned, GitHub-bound Sonar project
        required: true
        type: string
      organization:
        required: true
        type: string
      server-url:
        description: SonarQube Cloud region endpoint
        default: https://sonarcloud.io
        type: string
    secrets:
      SONAR_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  analyze:
    name: Source quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PRIMARY_COMPONENT: ${{ github.repository == 'Narx-Space-Prod/commerce-frontend' && 'frontend' || github.repository == 'Narx-Space-Prod/commerce-catalogue' && 'catalogue' || 'orders' }}
    steps:
      - name: Check out source with SCM history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download primary component analysis inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: analysis-${{ env.PRIMARY_COMPONENT }}
          path: analysis/analysis-${{ env.PRIMARY_COMPONENT }}
      - name: Download Cart analysis inputs for the combined Orders project
        if: github.repository == 'Narx-Space-Prod/commerce-orders'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: analysis-cart
          path: analysis/analysis-cart
      - name: Validate project identity and configure analysis
        env:
          PROJECT_KEY: ${{ inputs.project-key }}
          SONAR_ORGANIZATION: ${{ inputs.organization }}
          SONAR_SERVER: ${{ inputs.server-url }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          repositories = {
              'Narx-Space-Prod/commerce-frontend': ('src,public', 'tests', '**/*.test.js'),
              'Narx-Space-Prod/commerce-catalogue': ('.', '.', '**/*_test.go'),
              'Narx-Space-Prod/commerce-orders': ('src/main,cart', 'src/test,cart/tests', '**/tests/**,**/src/test/**'),
          }
          if os.environ['GITHUB_REPOSITORY'] not in repositories:
              raise SystemExit('Unsupported application repository')
          for key in ('PROJECT_KEY', 'SONAR_ORGANIZATION'):
              if not re.fullmatch(r'[A-Za-z0-9_.:-]+', os.environ[key]):
                  raise SystemExit('Missing or invalid Sonar identity: ' + key)
          if os.environ['SONAR_SERVER'] not in {'https://sonarcloud.io', 'https://sonarqube.us'}:
              raise SystemExit('Unsupported SonarQube Cloud region')
          sources, tests, inclusions = repositories[os.environ['GITHUB_REPOSITORY']]
          settings = {
              'sonar.projectKey': os.environ['PROJECT_KEY'],
              'sonar.organization': os.environ['SONAR_ORGANIZATION'],
              'sonar.host.url': os.environ['SONAR_SERVER'],
              'sonar.sources': sources,
              'sonar.tests': tests,
              'sonar.test.inclusions': inclusions,
              'sonar.exclusions': 'analysis/**,**/tests/**,**/src/test/**,**/*_test.go,**/node_modules/**,**/target/**,**/.git/**',
              'sonar.sourceEncoding': 'UTF-8',
              'sonar.qualitygate.wait': 'true',
              'sonar.qualitygate.timeout': '600',
              'sonar.scm.provider': 'git',
          }
          if os.environ['GITHUB_REPOSITORY'].endswith('/commerce-orders'):
              settings.update({'sonar.java.binaries': 'analysis/analysis-orders/classes',
                               'sonar.java.test.binaries': 'analysis/analysis-orders/test-classes',
                               'sonar.java.libraries': 'analysis/analysis-orders/libraries/*.jar',
                               'sonar.java.source': '21', 'sonar.python.version': '3.12'})
          components = {'Narx-Space-Prod/commerce-frontend': ['frontend'],
                        'Narx-Space-Prod/commerce-catalogue': ['catalogue'],
                        'Narx-Space-Prod/commerce-orders': ['orders', 'cart']}[os.environ['GITHUB_REPOSITORY']]
          import json
          for component in components:
              root=Path('analysis')/('analysis-'+component)
              identity=json.loads((root/'source.json').read_text())
              if identity != {'repository':os.environ['GITHUB_REPOSITORY'],
                              'commit':os.environ['GITHUB_SHA'],'component':component}:
                  raise SystemExit('Analysis inputs do not match this repository/revision')
              report={'frontend':'lcov.info','catalogue':'coverage.out',
                      'orders':'jacoco.xml','cart':'coverage.xml'}[component]
              if not (root/report).is_file() or (root/report).stat().st_size == 0:
                  raise SystemExit('Coverage input is missing: '+component)
          if 'frontend' in components:
              settings['sonar.javascript.lcov.reportPaths']='analysis/analysis-frontend/lcov.info'
          if 'catalogue' in components:
              settings['sonar.go.coverage.reportPaths']='analysis/analysis-catalogue/coverage.out'
          if 'orders' in components:
              # Cart tests run with /src as their project root in Docker. Resolve
              # XML sources against Cart's location in the combined Orders repo.
              import xml.etree.ElementTree as ET
              report=Path('analysis/analysis-cart/coverage.xml')
              tree=ET.parse(report)
              sources=tree.getroot().find('sources')
              if sources is None:
                  sources=ET.SubElement(tree.getroot(),'sources')
              sources.clear()
              ET.SubElement(sources,'source').text='cart'
              tree.write(report, encoding='utf-8', xml_declaration=True)
              settings['sonar.coverage.jacoco.xmlReportPaths']='analysis/analysis-orders/jacoco.xml'
              settings['sonar.python.coverage.reportPaths']='analysis/analysis-cart/coverage.xml'
          # An explicit generated settings file prevents a repository-level properties
          # file from silently replacing the centrally reviewed identity and scopes.
          Path(os.environ['RUNNER_TEMP'], 'narx-sonar.properties').write_text(
              ''.join(f'{key}={value}\n' for key, value in settings.items()))
          PY
      - name: Check analysis credential
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo 'SONAR_TOKEN is missing. Configure the repository analysis token before enabling this workflow.' >&2
            exit 1
          fi
      - name: Analyze source and wait for the quality gate
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dproject.settings=${{ runner.temp }}/narx-sonar.properties
