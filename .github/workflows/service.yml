name: Application image publication

on:
  workflow_call:
    inputs:
      component:
        description: Allowlisted component (frontend, catalogue, orders or cart)
        required: true
        type: string
      changed:
        description: Meaningful runtime change reported by the build workflow
        required: true
        type: boolean
    outputs:
      image:
        value: ${{ jobs.publish.outputs.image }}
      digest:
        value: ${{ jobs.publish.outputs.digest }}

permissions:
  contents: read

jobs:
  publish:
    name: Publish signed image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DELIVERY_ENABLED == 'true' && inputs.changed
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      packages: write
    outputs:
      image: ${{ steps.identity.outputs.image }}
      digest: ${{ steps.identity.outputs.digest }}
    env:
      COMPONENT: ${{ inputs.component }}
      IMAGE_TAG: narx-check-${{ inputs.component }}:${{ github.sha }}
    steps:
      - name: Validate publishing identity
        run: |
          printf 'DOCKER_CONFIG=%s/narx-docker-publish\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          python3 - <<'PYTHON'
          import os
          expected={'frontend':'commerce-frontend','catalogue':'commerce-catalogue',
                    'orders':'commerce-orders','cart':'commerce-orders'}
          if os.environ['GITHUB_REPOSITORY'] != 'Narx-Space-Prod/' + expected.get(os.environ['COMPONENT'], ''):
              raise SystemExit('Unexpected publishing component/repository')
          PYTHON
      - name: Download tested runtime image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-${{ inputs.component }}
          path: runtime
      - name: Download matching security evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: security-${{ inputs.component }}
          path: release
      - name: Load exact tested image
        run: docker load --input runtime/runtime.tar
      - name: Authenticate to GHCR using this workflow's short-lived token
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish immutable commit image
        id: identity
        run: |
          set -euo pipefail
          image="ghcr.io/narx-space-prod/commerce-$COMPONENT"
          tag="$image:$GITHUB_SHA"
          local_id=$(docker image inspect "$IMAGE_TAG" --format '{{.Id}}')
          export local_id
          if docker buildx imagetools inspect "$tag" --raw > existing.json 2> lookup-error.txt; then
            python3 - <<'PYTHON'
          import json, os
          with open('existing.json') as source:
              manifest=json.load(source)
          if manifest.get('config',{}).get('digest') != os.environ['local_id']:
              raise SystemExit('Commit already exists with another build. Publish a new reviewed commit instead.')
          PYTHON
          elif grep -Eiq 'manifest unknown|manifest .*not found|: not found' lookup-error.txt; then
            docker tag "$IMAGE_TAG" "$tag"
            docker push "$tag"
          else
            cat lookup-error.txt >&2
            exit 1
          fi
          digest=$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          # Bind to the final digest as well, so a concurrent tag change cannot get signed.
          docker buildx imagetools inspect "$image@$digest" --raw > published.json
          python3 - <<'PYTHON'
          import json, os
          with open('published.json') as source:
              manifest=json.load(source)
          if manifest.get('config',{}).get('digest') != os.environ['local_id']:
              raise SystemExit('Published digest does not match the tested image')
          PYTHON
          printf 'image=%s\ndigest=%s\n' "$image" "$digest" >> "$GITHUB_OUTPUT"
          printf 'IMAGE_REFERENCE=%s@%s\n' "$image" "$digest" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          predicate = {'repository': os.environ['GITHUB_REPOSITORY'], 'commit': os.environ['GITHUB_SHA'],
                       'component': os.environ['COMPONENT'], 'runId': int(os.environ['GITHUB_RUN_ID']),
                       'workflow': '.github/workflows/ci.yml', 'ref': 'refs/heads/main'}
          Path('release/provenance.json').write_text(json.dumps(predicate, sort_keys=True) + '\n')
          PY
      - name: Install pinned keyless signing client
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Sign image, provenance and SBOM
        run: |
          cosign sign --yes "$IMAGE_REFERENCE"
          cosign attest --yes --type https://narx.space/attestations/release/v1 --predicate release/provenance.json "$IMAGE_REFERENCE"
          cosign attest --yes --type cyclonedx --predicate release/sbom.cdx.json "$IMAGE_REFERENCE"
          printf '### %s release\n\n%s\n\nSource: %s\n' "$COMPONENT" "$IMAGE_REFERENCE" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary registry login
        if: always()
        run: if [ -n "${DOCKER_CONFIG:-}" ]; then rm -rf "$DOCKER_CONFIG"; fi
