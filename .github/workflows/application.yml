name: Application pipeline

on:
  workflow_call:
    inputs:
      application:
        description: frontend, catalogue or orders (Orders includes its Cart companion)
        required: true
        type: string
    secrets:
      SONAR_TOKEN:
        required: true
      NARX_RELEASE_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  validate:
    name: 01 - Source policy
    uses: Narx-Space-Prod/platform-ci/.github/workflows/workflows.yml@666b596743c0fd43a0ba3ed1efb8dc7b89b7593e
  intake:
    name: 00 - Start end-to-end release graph
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DELIVERY_ENABLED == 'true'
    uses: ./.github/workflows/intake.yml
    secrets:
      NARX_RELEASE_APP_PRIVATE_KEY: ${{ secrets.NARX_RELEASE_APP_PRIVATE_KEY }}
  build:
    name: 02 - Build test and scan
    needs: validate
    uses: ./.github/workflows/build.yml
    with:
      component: ${{ inputs.application }}
  cart:
    name: 02 - Cart build test and scan
    if: inputs.application == 'orders'
    needs: validate
    uses: ./.github/workflows/build.yml
    with:
      component: cart
      context: cart
  quality:
    name: 03 - Sonar quality gate
    needs: [build, cart]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.cart.result == 'success' || needs.cart.result == 'skipped') }}
    uses: Narx-Space-Prod/platform-ci/.github/workflows/sonar.yml@5c5e186e8b028a62ed002af36595281429505659
    with:
      organization: ${{ vars.SONAR_ORGANIZATION }}
      project-key: ${{ vars.SONAR_PROJECT_KEY }}
      server-url: ${{ vars.SONAR_SERVER_URL || 'https://sonarcloud.io' }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  publish:
    name: 04 - Sign and publish
    needs: [build, quality]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.quality.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DELIVERY_ENABLED == 'true' && needs.build.outputs.changed == 'true' }}
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: Narx-Space-Prod/platform-ci/.github/workflows/service.yml@35ff4ae9d506db00dbc2adc7ec027382bbe99db3
    with:
      component: ${{ inputs.application }}
      changed: ${{ needs.build.outputs.changed == 'true' }}
  cart-publish:
    name: 04 - Cart sign and publish
    needs: [cart, quality]
    if: ${{ !cancelled() && needs.cart.result == 'success' && needs.quality.result == 'success' && inputs.application == 'orders' && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DELIVERY_ENABLED == 'true' && needs.cart.outputs.changed == 'true' }}
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: Narx-Space-Prod/platform-ci/.github/workflows/service.yml@35ff4ae9d506db00dbc2adc7ec027382bbe99db3
    with:
      component: cart
      changed: ${{ needs.cart.outputs.changed == 'true' }}
  delivery:
    name: 05 - Record release facts
    needs: [publish, cart-publish]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DELIVERY_ENABLED == 'true' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') && (needs.cart-publish.result == 'success' || needs.cart-publish.result == 'skipped') && (needs.publish.result == 'success' || needs.cart-publish.result == 'success') }}
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      releases: |
        [
          {"component":"${{ inputs.application }}","image":"${{ needs.publish.outputs.image }}","digest":"${{ needs.publish.outputs.digest }}"},
          {"component":"cart","image":"${{ needs.cart-publish.outputs.image }}","digest":"${{ needs.cart-publish.outputs.digest }}"}
        ]

  test-evidence:
    needs: [build, cart]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.cart.result == 'success' || needs.cart.result == 'skipped') }}
    uses: ./.github/workflows/evidence.yml
    with:
      gate: tests
      application: ${{ inputs.application }}
      primary: ${{ needs.build.result }}
      companion: ${{ needs.cart.result }}
  quality-evidence:
    needs: quality
    if: ${{ !cancelled() && needs.quality.result == 'success' }}
    uses: ./.github/workflows/evidence.yml
    with:
      gate: quality
      application: ${{ inputs.application }}
      primary: ${{ needs.quality.result }}
  publication-evidence:
    needs: [quality, publish, cart-publish, delivery]
    if: ${{ !cancelled() && github.event_name == 'push' && needs.quality.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') && (needs.cart-publish.result == 'success' || needs.cart-publish.result == 'skipped') && (needs.delivery.result == 'success' || needs.delivery.result == 'skipped') }}
    uses: ./.github/workflows/evidence.yml
    with:
      gate: publication
      application: ${{ inputs.application }}
      primary: ${{ needs.publish.result }}
      companion: ${{ needs.cart-publish.result }}
      releases: |
        [
          {"component":"${{ inputs.application }}","image":"${{ needs.publish.outputs.image }}","digest":"${{ needs.publish.outputs.digest }}"},
          {"component":"cart","image":"${{ needs.cart-publish.outputs.image }}","digest":"${{ needs.cart-publish.outputs.digest }}"}
        ]
