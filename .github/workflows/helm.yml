name: Helm validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Helm validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.0
      - name: Install verified Kubernetes schema validator
        env:
          KUBECONFORM_VERSION: 0.8.0
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          archive="$RUNNER_TEMP/kubeconform.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$KUBECONFORM_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" kubeconform
      - name: Validate chart and render all environment profiles
        run: |
          # Dummy image exists only in rendered validation output, never in GitOps release state.
          digest="sha256:$(printf '%064d' 0)"
          for environment in dev qa production; do
            values="environments/$environment/values.yaml"
            rendered="$RUNNER_TEMP/$environment.yaml"
            helm lint --strict charts/commerce-service -f "$values" \
              --set image.repository=registry.invalid/validation-only/catalogue --set "image.digest=$digest"
            helm template catalogue charts/commerce-service -n "commerce-$environment" -f "$values" \
              --set image.repository=registry.invalid/validation-only/catalogue --set "image.digest=$digest" > "$rendered"
            "$RUNNER_TEMP/kubeconform" -strict -summary -kubernetes-version 1.35.0 "$rendered"
          done
      - name: Reject missing immutable image identity
        run: |
          if helm template catalogue charts/commerce-service >/dev/null 2>&1; then
            echo 'Chart incorrectly accepted a release without an image repository and digest.' >&2
            exit 1
          fi
