name: Terraform validation

on:
  workflow_call:
    inputs:
      working-directory:
        description: Terraform root relative to the caller repository
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Terraform validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false
      - name: Check formatting
        run: terraform fmt -check -recursive
      - name: Install locked providers without configuring a backend
        working-directory: ${{ inputs.working-directory }}
        run: terraform init -backend=false -input=false -lockfile=readonly
      - name: Validate configuration
        working-directory: ${{ inputs.working-directory }}
        run: terraform validate -no-color
      - name: Run tests with mocked AWS provider
        working-directory: ${{ inputs.working-directory }}
        run: terraform test -no-color
      - name: Scan Terraform security configuration
        env:
          TF_ROOT: ${{ inputs.working-directory }}
          TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
        run: |
          archive="$RUNNER_TEMP/trivy.tar.gz"
          curl --fail --silent --show-error --location --retry 2 \
            https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_Linux-64bit.tar.gz --output "$archive"
          printf '%s  %s\n' "$TRIVY_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" trivy
          # A reviewed, expiring control exception: SSE-S3 is permitted for the existing lab state bucket.
          if [ "$TF_ROOT" = bootstrap ]; then
          cat > "$RUNNER_TEMP/reviewed-iac-exceptions.yaml" <<'POLICY'
          misconfigurations:
            - id: AVD-AWS-0132
              paths: [main.tf]
              statement: "SSE-S3 encrypts this lab state bucket; customer-managed KMS is not a project requirement. Re-review before production state activation."
              expired_at: 2027-01-20
          POLICY
          else
            printf 'misconfigurations: []\n' > "$RUNNER_TEMP/reviewed-iac-exceptions.yaml"
          fi
          "$RUNNER_TEMP/trivy" config --config /dev/null --ignorefile "$RUNNER_TEMP/reviewed-iac-exceptions.yaml" \
            --severity HIGH,CRITICAL --exit-code 1 "$TF_ROOT"
