name: Application build and coverage

on:
  workflow_call:
    inputs:
      component:
        description: Allowlisted component (frontend, catalogue, orders or cart)
        required: true
        type: string
      context:
        description: Build context relative to the caller repository
        default: .
        type: string
    outputs:
      changed:
        value: ${{ jobs.build.outputs.changed }}

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    env:
      COMPONENT: ${{ inputs.component }}
      BUILD_CONTEXT: ${{ inputs.context }}
      IMAGE_TAG: narx-check-${{ inputs.component }}:${{ github.sha }}
    steps:
      - name: Check out application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate component and detect meaningful changes
        id: changes
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          expected = {'frontend': ('Narx-Space-Prod/commerce-frontend', '.'),
                      'catalogue': ('Narx-Space-Prod/commerce-catalogue', '.'),
                      'orders': ('Narx-Space-Prod/commerce-orders', '.'),
                      'cart': ('Narx-Space-Prod/commerce-orders', 'cart')}
          if expected.get(os.environ['COMPONENT']) != (os.environ['GITHUB_REPOSITORY'], os.environ['BUILD_CONTEXT']):
              raise SystemExit('Unexpected component, repository or build context')
          with open(os.environ['GITHUB_EVENT_PATH']) as source:
              event = json.load(source)
          base = event.get('pull_request', {}).get('base', {}).get('sha') or event.get('before', '')
          if not base or set(base) == {'0'}:
              changed = True
          else:
              files = subprocess.check_output(['git', 'diff', '--name-only', '-z', base, os.environ['GITHUB_SHA']]).decode().split('\0')
              def relevant(path):
                  if not path:
                      return False
                  if path.startswith(('.github/workflows/', '.github/actions/')):
                      return True
                  if os.environ['COMPONENT'] == 'cart':
                      return path.startswith('cart/') and not path.endswith('/README.md')
                  if os.environ['COMPONENT'] == 'orders' and path.startswith('cart/'):
                      return False
                  return path not in {'README.md', 'LICENSE', '.github/CODEOWNERS', '.github/PULL_REQUEST_TEMPLATE.md'} and not path.startswith('docs/')
              changed = any(map(relevant, files))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('changed=' + str(changed).lower() + '\n')
          print('Build required:', changed)
          PY
      - name: Set up BuildKit
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build tested runtime image once
        if: steps.changes.outputs.changed == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          target: runtime
          load: true
          push: false
          tags: ${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.component }}
          cache-to: type=gha,mode=max,scope=${{ inputs.component }}
      - name: Export coverage and analysis inputs from cached test stages
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          target: analysis
          outputs: type=local,dest=${{ runner.temp }}/analysis/${{ inputs.component }}
          cache-from: |
            type=gha,scope=${{ inputs.component }}
            type=gha,scope=analysis-${{ inputs.component }}
          cache-to: type=gha,mode=max,scope=analysis-${{ inputs.component }}
      - name: Bind analysis reports to this source revision
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'analysis'/os.environ['COMPONENT']
          expected={'frontend':'lcov.info','catalogue':'coverage.out',
                    'orders':'jacoco.xml','cart':'coverage.xml'}[os.environ['COMPONENT']]
          if not (root/expected).is_file() or (root/expected).stat().st_size == 0:
              raise SystemExit('Required coverage report is missing or empty')
          # Report the actual metric in the job summary, without inventing a
          # universal percentage threshold across different language formats.
          import xml.etree.ElementTree as ET
          component=os.environ['COMPONENT']
          if component=='frontend':
              lines=(root/expected).read_text().splitlines()
              total=sum(int(line[3:]) for line in lines if line.startswith('LF:'))
              covered=sum(int(line[3:]) for line in lines if line.startswith('LH:'))
              metric='lines'
          elif component=='catalogue':
              rows=[line.split() for line in (root/expected).read_text().splitlines()[1:]]
              total=sum(int(row[1]) for row in rows)
              covered=sum(int(row[1]) for row in rows if int(row[2])>0)
              metric='statements'
          elif component=='orders':
              counter=next(c for c in ET.parse(root/expected).getroot().findall('counter') if c.attrib['type']=='LINE')
              covered=int(counter.attrib['covered']);total=covered+int(counter.attrib['missed']);metric='lines'
          else:
              attrs=ET.parse(root/expected).getroot().attrib
              covered=int(attrs['lines-covered']);total=int(attrs['lines-valid']);metric='lines'
          if total<=0 or covered<0 or covered>total:
              raise SystemExit('Coverage report contains no measurable application code or invalid counters')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              summary.write(f'### {component} test coverage\n\n{covered}/{total} {metric} ({100*covered/total:.1f}%). Full report: `analysis-{component}` artifact.\n')
          (root/'source.json').write_text(json.dumps({'repository':os.environ['GITHUB_REPOSITORY'],
              'commit':os.environ['GITHUB_SHA'],'component':os.environ['COMPONENT']})+'\n')
          PYTHON
      - name: Retain coverage and analysis inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: analysis-${{ inputs.component }}
          path: ${{ runner.temp }}/analysis/${{ inputs.component }}/
          retention-days: 1
          if-no-files-found: error
      - name: Verify non-root runtime
        if: steps.changes.outputs.changed == 'true'
        run: |
          user=$(docker image inspect "$IMAGE_TAG" --format '{{.Config.User}}')
          case "$user" in
            ''|root|root:*|0|0:*) echo 'Runtime image must specify a non-root user.' >&2; exit 1 ;;
          esac
      - name: Component integration tests of the tested runtime
        if: steps.changes.outputs.changed == 'true'
        uses: Narx-Space-Prod/platform-ci/integration@bee471591c8b97eb389f91f5abfc95e09ee85a1d
        with:
          component: ${{ inputs.component }}
          image: ${{ env.IMAGE_TAG }}
      - name: Retain integration test results
        if: always() && steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-${{ inputs.component }}
          path: ${{ runner.temp }}/integration-${{ inputs.component }}.xml
          retention-days: 14
          if-no-files-found: warn
      - name: Install verified vulnerability scanner
        if: steps.changes.outputs.changed == 'true'
        env:
          TRIVY_VERSION: 0.76.1
          TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
        run: |
          archive="$RUNNER_TEMP/trivy.tar.gz"
          curl --fail --silent --show-error --location --retry 2 \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" --output "$archive"
          printf '%s  %s\n' "$TRIVY_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" trivy
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Cache vulnerability databases
        if: steps.changes.outputs.changed == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-v0.76.1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: trivy-v0.76.1-${{ runner.os }}-
      - name: Scan tested image and generate SBOM
        if: steps.changes.outputs.changed == 'true'
        run: |
          mkdir -p release
          : > "$RUNNER_TEMP/no-vulnerability-exceptions"
          trivy image --config /dev/null --scanners vuln --format json \
            --ignorefile "$RUNNER_TEMP/no-vulnerability-exceptions" \
            --output release/vulnerabilities.json "$IMAGE_TAG"
          trivy convert --format cyclonedx --output release/sbom.cdx.json release/vulnerabilities.json
          # Unfixed HIGH/CRITICAL findings also block publication.
          trivy convert --format table --severity HIGH,CRITICAL --exit-code 1 release/vulnerabilities.json
      - name: Retain security evidence
        if: always() && steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-${{ inputs.component }}
          path: release/
          retention-days: 14
          if-no-files-found: warn
      - name: Export exact tested image for trusted publisher
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DELIVERY_ENABLED == 'true' && steps.changes.outputs.changed == 'true'
        run: docker save "$IMAGE_TAG" --output "$RUNNER_TEMP/runtime.tar"
      - name: Transfer image without rebuilding
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DELIVERY_ENABLED == 'true' && steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-${{ inputs.component }}
          path: ${{ runner.temp }}/runtime.tar
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Report publication held until delivery activation
        if: github.event_name == 'push' && vars.DELIVERY_ENABLED != 'true'
        run: echo 'GHCR publishing is disabled. Configure package access and the dedicated Narx release App before setting DELIVERY_ENABLED=true.' >> "$GITHUB_STEP_SUMMARY"

