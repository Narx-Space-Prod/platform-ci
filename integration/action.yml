name: Runtime component integration
description: Test the already-built runtime with disposable dependencies on the hosted runner
inputs:
  component:
    required: true
    description: Validated application component
  image:
    required: true
    description: Current tested runtime image in the local Docker daemon
runs:
  using: composite
  steps:
    - name: Component integration tests
      shell: bash
      env:
        COMPONENT: ${{ inputs.component }}
        TESTED_IMAGE: ${{ inputs.image }}
      run: python3 "$GITHUB_ACTION_PATH/runner.py" --component "$COMPONENT" --image "$TESTED_IMAGE" --report "$RUNNER_TEMP/integration-$COMPONENT.xml"
